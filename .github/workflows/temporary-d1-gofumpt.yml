name: Temporary D1 Gofumpt Export

on:
  push:
    branches: [feat/d1-character-device-types]

permissions:
  contents: read

jobs:
  gofumpt-export:
    name: Export gofumpt results
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Format and emit sources
        shell: bash
        run: |
          set -euo pipefail
          files=(
            internal/modules/catalog/adapters/memory/store.go
            internal/modules/catalog/adapters/mysql/store.go
            internal/modules/catalog/domain/catalog.go
            internal/modules/catalog/domain/catalog_test.go
            internal/modules/catalog/http/handler_test.go
            internal/modules/catalog/usecase/usecase_test.go
          )
          go run mvdan.cc/gofumpt@v0.12.0 -extra -w "${files[@]}"
          for file in "${files[@]}"; do
            echo "D1_FORMAT2_START:${file}"
            base64 -w 0 "${file}"
            echo
            echo "D1_FORMAT2_END:${file}"
          done
