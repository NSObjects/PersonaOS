name: Format Opus Demo PR

on:
  push:
    branches: [feat/demo-opus-audio]
    paths: [.github/workflows/opus-format.yml]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/demo-opus-audio
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Format Opus Go files
        run: gofmt -w internal/modules/agentdemo/usecase/voice.go internal/modules/agentdemo/usecase/voice_opus.go internal/modules/agentdemo/usecase/voice_test.go internal/modules/agentdemo/http/voice.go internal/modules/agentdemo/voiceconfig/provider.go internal/boot/business.go
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/modules/agentdemo internal/boot/business.go
          if ! git diff --cached --quiet; then
            git commit -m "style(voice): gofmt Opus implementation"
            git push origin HEAD:feat/demo-opus-audio
          fi
