name: VAD dependency probe
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  resolve:
    if: github.head_ref == 'feat/demo-silero-vad'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve pinned dependencies
        run: |
          cp package-lock.json /tmp/vad-original-lock.json
          npm install --package-lock-only --ignore-scripts --save-exact @ricky0123/vad-web@0.0.31 onnxruntime-web@1.22.0
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const original = JSON.parse(fs.readFileSync('/tmp/vad-original-lock.json', 'utf8'));
          const updated = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const added = Object.fromEntries(Object.entries(updated.packages).filter(([key, value]) => JSON.stringify(value) !== JSON.stringify(original.packages[key])));
          const removed = Object.keys(original.packages).filter(key => !(key in updated.packages));
          console.log('VAD_LOCK_DELTA_BEGIN');
          console.log(JSON.stringify({added, removed}));
          console.log('VAD_LOCK_DELTA_END');
          NODE
      - name: Verify package files
        run: |
          npm ci --ignore-scripts
          ls node_modules/@ricky0123/vad-web/dist
          ls node_modules/onnxruntime-web/dist
