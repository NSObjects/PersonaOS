name: Format voice integration

on:
  push:
    branches:
      - feat/demo-speech-sdk-voice-turn
    paths:
      - .github/workflows/voice-fmt.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/demo-speech-sdk-voice-turn
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Format only changed Go files
        run: |
          go run mvdan.cc/gofumpt@v0.9.2 -extra -w internal/boot/business.go internal/modules/agentdemo/usecase/voice.go internal/modules/agentdemo/usecase/voice_test.go internal/modules/agentdemo/http/voice.go internal/modules/agentdemo/voiceconfig/provider.go
      - name: Commit formatting if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/boot/business.go internal/modules/agentdemo
          if ! git diff --cached --quiet; then
            git commit -m "style(demo): apply gofumpt to speech integration"
            git push origin HEAD:feat/demo-speech-sdk-voice-turn
          fi
