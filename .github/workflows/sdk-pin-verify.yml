name: Resolve SDK pin
on:
  push:
    branches: [test/demo-live-voice]
    paths: ['.github/workflows/sdk-pin-verify.yml']
permissions:
  contents: read
jobs:
  checksum:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download -json github.com/NSObjects/go-speech@41b6fc9a86426b79d05c5006d044dd3203b57d71
