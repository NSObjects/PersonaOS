name: Demo live voice (paid)

on:
  push:
    paths:
      - 'internal/modules/agentdemo/**'
      - 'tests/e2e/voice_live.py'
      - '.github/workflows/demo-live-voice.yml'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-live-voice-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live:
    name: Real Aliyun Opus / Eino / memory
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-only
          MYSQL_DATABASE: personaos_ci
          MYSQL_USER: ci_user
          MYSQL_PASSWORD: ci-test-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -pci-root-only --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v7
      - name: Check required configuration
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          DASHSCOPE_WS_ENDPOINT: ${{ vars.DASHSCOPE_WS_ENDPOINT }}
          DASHSCOPE_TTS_VOICE: ${{ vars.DASHSCOPE_TTS_VOICE || 'longanyang' }}
          PERSONAOS_LLM_API_KEY: ${{ secrets.PERSONAOS_LLM_API_KEY }}
          PERSONAOS_LLM_MODEL: ${{ vars.PERSONAOS_LLM_MODEL }}
        run: |
          missing=0
          for name in DASHSCOPE_API_KEY DASHSCOPE_TTS_VOICE PERSONAOS_LLM_API_KEY PERSONAOS_LLM_MODEL; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret or variable: $name"
              missing=1
            fi
          done
          if [ "$missing" != 0 ]; then
            echo "Live voice NOT VALIDATED: configuration missing." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          case "$DASHSCOPE_WS_ENDPOINT" in
            ""|wss://*/api-ws/v1/inference) ;;
            *) echo "::error::DASHSCOPE_WS_ENDPOINT must be empty or a secure inference endpoint"; exit 1 ;;
          esac
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify test script and install audio tools
        timeout-minutes: 4
        run: |
          python3 -m py_compile tests/e2e/voice_live.py
          # Avoid slow and inconsistent Ubuntu package mirrors. Use the
          # version-pinned static releases and verify both published digests.
          set -euo pipefail
          bin="$RUNNER_TEMP/personaos-ffmpeg"
          mkdir -p "$bin"
          release=https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1
          curl --fail --location --silent --show-error --retry 1 --max-time 90 \
            "$release/ffmpeg-linux-x64.gz" -o "$bin/ffmpeg.gz"
          curl --fail --location --silent --show-error --retry 1 --max-time 90 \
            "$release/ffprobe-linux-x64.gz" -o "$bin/ffprobe.gz"
          (
            cd "$bin"
            printf '%s  %s\n' \
              bfe8a8fc511530457b528c48d77b5737527b504a3797a9bc4866aeca69c2dffa ffmpeg.gz \
              25d9b6ccb05e3d9de9e04e31e2506d8dd7f9f0418981965ac6df12e8d3afd067 ffprobe.gz \
              | sha256sum --check
            gzip -d ffmpeg.gz ffprobe.gz
            chmod +x ffmpeg ffprobe
          )
          "$bin/ffmpeg" -version
          "$bin/ffprobe" -version
          echo "$bin" >> "$GITHUB_PATH"
      - name: Build PersonaOS
        run: go build -o /tmp/personaos-live .
      - name: Run real cloud acceptance
        env:
          PERSONAOS_KNOWLEDGE_DIR: /tmp/personaos-ci-knowledge
          ECHO_ADMIN_MYSQL_PASSWORD: ci-test-only
          PERSONAOS_CI_MYSQL_CONTAINER: ${{ job.services.mysql.id }}
          PERSONAOS_ASR_PROVIDER: aliyun
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          DASHSCOPE_WS_ENDPOINT: ${{ vars.DASHSCOPE_WS_ENDPOINT }}
          DASHSCOPE_TTS_VOICE: ${{ vars.DASHSCOPE_TTS_VOICE || 'longanyang' }}
          PERSONAOS_LLM_API_KEY: ${{ secrets.PERSONAOS_LLM_API_KEY }}
          PERSONAOS_LLM_MODEL: ${{ vars.PERSONAOS_LLM_MODEL }}
          PERSONAOS_LLM_BASE_URL: ${{ vars.PERSONAOS_LLM_BASE_URL }}
        run: |
          set -euo pipefail
          mkdir -p "$PERSONAOS_KNOWLEDGE_DIR"
          printf '月光徽章的编号是 LX-7429。\n' > "$PERSONAOS_KNOWLEDGE_DIR/ci-lore.txt"
          /tmp/personaos-live --config configs/config.ci.toml > /tmp/personaos-live.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:9322/api/health >/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              echo "::error::PersonaOS exited during startup"
              exit 1
            fi
            sleep 1
          done
          test "$ready" = 1
          curl --fail --silent --show-error \
            -H 'Content-Type: application/json' \
            --data '{"username":"ciadmin","display_name":"CI Admin","password":"ci-administrator-only","site_name":"PersonaOS Voice CI"}' \
            http://127.0.0.1:9322/api/setup | jq -e '.data.initialized == true'
          python3 -u tests/e2e/voice_live.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Report server voice timing
        if: always()
        run: |
          if [ -f /tmp/personaos-live.log ]; then
            jq -Rrc 'fromjson? | select(.message == "demo voice reply timing") | {tts_open_ms,llm_first_text_ms,tts_first_text_sent_ms,first_audio_bytes_ms,total_ms}' /tmp/personaos-live.log | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Report failure explicitly
        if: failure()
        run: |
          # Only internal errors from this disposable synthetic test, not full logs.
          if [ -f /tmp/personaos-live.log ]; then
            jq -Rrc 'fromjson? | select((.message == "API internal error" and ((.path // "") | startswith("/api/demo/"))) or .message == "demo voice stream failed") | {request_id, path, detail, error}' /tmp/personaos-live.log
          fi
          echo "Live voice NOT VALIDATED. See the failed step and request ID." >> "$GITHUB_STEP_SUMMARY"
