name: RAG dependency preparation
on:
  push:
    branches: [feat/redis-rag]
    paths:
      - '.github/workflows/rag-dependency-prep.yml'
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Resolve official Eino component versions
        run: |
          go get github.com/cloudwego/eino-ext/components/embedding/ark@v0.1.2 github.com/cloudwego/eino-ext/components/indexer/redis@4c50dabf6b51086fc7a3f7555bc95c103b78b7b1 github.com/cloudwego/eino-ext/components/retriever/redis@157485428197cd80508ef44cecc711ad6f3f5c00
          go mod download github.com/cloudwego/eino-ext/components/embedding/ark github.com/cloudwego/eino-ext/components/indexer/redis github.com/cloudwego/eino-ext/components/retriever/redis
          echo 'BEGIN MODULE DIFF'
          git diff -- go.mod go.sum
          echo 'END MODULE DIFF'
