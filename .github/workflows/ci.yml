name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: Go tests / race / vet / build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify dependencies
        run: go mod verify
      - name: Check gofmt
        run: |
          unformatted="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$unformatted" ]; then
            echo "Go files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: Race-enabled unit tests
        run: make test
      - name: Go vet
        run: make vet
      - name: Build all packages
        run: go build ./...

  go-lint:
    name: Go static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          install-mode: goinstall
          # Keep the existing rules, but gate only changed lines when upgrading
          # the analyzer so unrelated preexisting code does not block the Demo.
          args: --timeout=5m --new-from-rev=HEAD^

  redis-rag:
    name: Redis 8 vector knowledge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Test Eino Redis indexer and retriever
        env:
          PERSONAOS_TEST_REDIS_ADDR: 127.0.0.1:6379
        run: go test -race -count=1 -v ./internal/modules/agentdemo/adapters/redisrag

  web:
    name: Web lint / tests / build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  mysql-smoke:
    name: MySQL startup smoke
    runs-on: ubuntu-latest
    timeout-minutes: 22
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-only
          MYSQL_DATABASE: personaos_ci
          MYSQL_USER: ci_user
          MYSQL_PASSWORD: ci-test-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -pci-root-only --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate Docker Compose
        run: docker compose config -q
      - name: Build executable
        run: go build -o /tmp/personaos-ci .
      - name: Start real application and verify database bootstrap
        env:
          ECHO_ADMIN_MYSQL_PASSWORD: ci-test-only
        run: |
          set -euo pipefail
          /tmp/personaos-ci --config configs/config.ci.toml > /tmp/personaos-ci.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true; cat /tmp/personaos-ci.log' EXIT

          # Health must be available even before first initialization.
          ready=0
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:9322/api/health > /tmp/health.json; then
              ready=1
              break
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              echo "application exited during startup"
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "application did not start"
            exit 1
          fi

          # Before first initialization, /api/ready intentionally returns 409.
          curl --fail --silent http://127.0.0.1:9322/api/setup/state > /tmp/setup.before.json
          jq -e '.data.initialized == false' /tmp/setup.before.json
          status="$(curl --silent --output /tmp/ready.before.json --write-out '%{http_code}' http://127.0.0.1:9322/api/ready)"
          test "$status" = "409"

          # Exercise the real first-initialization transaction and root-role setup.
          curl --fail --silent --show-error \
            -H 'Content-Type: application/json' \
            --data '{"username":"ciadmin","display_name":"CI Admin","password":"ci-administrator-only","site_name":"PersonaOS CI"}' \
            http://127.0.0.1:9322/api/setup > /tmp/setup.submit.json
          jq -e '.data.initialized == true' /tmp/setup.submit.json

          # Initialization must persist, and readiness must now be accessible.
          curl --fail --silent --show-error http://127.0.0.1:9322/api/setup/state > /tmp/setup.after.json
          jq -e '.data.initialized == true' /tmp/setup.after.json
          curl --fail --silent --show-error http://127.0.0.1:9322/api/ready > /tmp/ready.after.json
          jq -e '.status == "ready"' /tmp/ready.after.json

          # D1 acceptance: real CRUD, FK/uniqueness, persistence, plus
          # root grants migration on an already initialized database.
          export PERSONAOS_TEST_MYSQL_DSN='ci_user:ci-test-only@tcp(127.0.0.1:3306)/personaos_ci?parseTime=true&charset=utf8mb4'
          go test -count=1 -v ./internal/modules/catalog/adapters/mysql -run '^TestCatalogMySQLCompleteLifecycle$'
          go test -count=1 -v ./internal/modules/catalog/adapters/mysql -run '^TestResourceStoreMySQLLifecycle$'
          go test -count=1 -v ./internal/modules/catalog/adapters/mysql -run '^TestCapabilityDraftMySQLLifecycle$'
          go test -count=1 -v ./internal/modules/agentdemo/adapters/mysql -run '^(TestMemoryStoreMySQL|TestDeleteMemoryFactMySQL)
          go test -count=1 -v ./internal/boot -run '^TestUpgradeExistingDatabaseRestoresD1Catalog$'


  d1-browser:
    name: D1 browser E2E / MySQL
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-only
          MYSQL_DATABASE: personaos_ci
          MYSQL_USER: ci_user
          MYSQL_PASSWORD: ci-test-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -pci-root-only --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web and browser dependencies
        run: |
          npm ci --prefix web --no-audit --no-fund
          python3 -m venv /tmp/personaos-playwright
          /tmp/personaos-playwright/bin/pip install --disable-pip-version-check playwright==1.65.1
          /tmp/personaos-playwright/bin/playwright install --with-deps chromium
      - name: Build Go backend
        run: go build -o /tmp/personaos-d1 .
      - name: Run real browser acceptance against Umi and Go
        env:
          ECHO_ADMIN_MYSQL_PASSWORD: ci-test-only
          ECHO_ADMIN_WEB_API_TARGET: http://127.0.0.1:9322
          PERSONAOS_E2E_BASE_URL: http://127.0.0.1:8000
          PERSONAOS_E2E_ARTIFACT_DIR: /tmp/personaos-e2e
        run: |
          set -euo pipefail
          /tmp/personaos-d1 --config configs/config.ci.toml > /tmp/personaos-d1-api.log 2>&1 &
          api_pid=$!
          (cd web && npm run dev) > /tmp/personaos-d1-web.log 2>&1 &
          web_pid=$!
          trap 'kill "$web_pid" "$api_pid" 2>/dev/null || true; tail -n 90 /tmp/personaos-d1-api.log; tail -n 90 /tmp/personaos-d1-web.log' EXIT
          started=0
          for attempt in $(seq 1 80); do
            if curl --fail --silent http://127.0.0.1:9322/api/health >/dev/null; then
              started=1
              break
            fi
            if ! kill -0 "$api_pid" 2>/dev/null; then
              echo "API exited early"
              exit 1
            fi
            sleep 1
          done
          test "$started" = "1"
          curl --fail --silent --show-error -H 'Content-Type: application/json' \
            --data '{"username":"ciadmin","display_name":"CI Admin","password":"ci-administrator-only","site_name":"PersonaOS CI"}' \
            http://127.0.0.1:9322/api/setup > /tmp/personaos-d1-setup.json
          jq -e '.data.initialized == true' /tmp/personaos-d1-setup.json
          started=0
          for attempt in $(seq 1 150); do
            if curl --fail --silent http://127.0.0.1:8000/user/login >/dev/null; then
              started=1
              break
            fi
            if ! kill -0 "$web_pid" 2>/dev/null; then
              echo "Web dev server exited early"
              exit 1
            fi
            sleep 1
          done
          test "$started" = "1"
          /tmp/personaos-playwright/bin/python tests/e2e/catalog_ui.py
          /tmp/personaos-playwright/bin/python tests/e2e/capability_draft_ui.py
      - name: Upload UI evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: d1-browser-diagnostics
          path: |
            /tmp/personaos-e2e
            /tmp/personaos-d1-api.log
            /tmp/personaos-d1-web.log
          retention-days: 7

          go test -count=1 -v ./internal/boot -run '^TestUpgradeExistingDatabaseRestoresD1Catalog$'


  d1-browser:
    name: D1 browser E2E / MySQL
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
