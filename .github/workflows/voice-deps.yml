name: Lock speech SDK dependency

on:
  push:
    branches:
      - feat/demo-speech-sdk-voice-turn
    paths:
      - .github/workflows/voice-deps.yml

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/demo-speech-sdk-voice-turn
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Resolve public go-speech main SDK
        run: |
          go get github.com/NSObjects/go-speech@82142913b8b202c22ebc2118ae889816eab7714f
          go mod tidy
      - name: Format Demo voice Go sources
        run: |
          gofmt -w internal/boot/business.go internal/boot/route_manifest_test.go internal/modules/access/domain/managed_api_route.go internal/modules/agentdemo/http/voice.go internal/modules/agentdemo/usecase/voice.go internal/modules/agentdemo/usecase/voice_test.go internal/modules/agentdemo/voiceconfig/provider.go
      - name: Commit dependency lock and formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add go.mod go.sum internal/boot/business.go internal/boot/route_manifest_test.go internal/modules/access/domain/managed_api_route.go internal/modules/agentdemo
          if ! git diff --cached --quiet; then
            git commit -m "chore(demo): lock go-speech dependency and format voice integration"
            git push origin HEAD:feat/demo-speech-sdk-voice-turn
          fi
